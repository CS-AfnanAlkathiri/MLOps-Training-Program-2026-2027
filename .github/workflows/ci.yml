
name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Task-3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/runtime.txt
          pip install -r requirements/dev.txt

      - name: Check code with Ruff
        run: python -m ruff check app src tests

      - name: Check formatting with Ruff
        run: python -m ruff format --check app src tests

      # Download Task 3's own model and data from Google Drive.
      # Do not expose credentials to pull requests from forks.
      - name: Download artifacts with DVC
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail

          python -m venv "$RUNNER_TEMP/dvc-ci-venv"

          "$RUNNER_TEMP/dvc-ci-venv/bin/python" -m pip install \
            "dvc[gdrive]==3.67.1" \
            "pyOpenSSL==24.2.1" \
            "cryptography==43.0.3" \
            "asyncssh<2.24"

          "$RUNNER_TEMP/dvc-ci-venv/bin/python" -m pip check

          credentials_file="$RUNNER_TEMP/dvc-service-account.json"

          cleanup() {
            rm -f "$credentials_file"
          }
          trap cleanup EXIT

          if [ -z "$GDRIVE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Google Drive service account secret is missing."
            exit 1
          fi

          printf '%s' "$GDRIVE_SERVICE_ACCOUNT_JSON" > "$credentials_file"
          chmod 600 "$credentials_file"

          "$RUNNER_TEMP/dvc-ci-venv/bin/dvc" remote modify \
            --local storage gdrive_use_service_account true

          "$RUNNER_TEMP/dvc-ci-venv/bin/dvc" remote modify \
            --local storage gdrive_service_account_json_file_path \
            "$credentials_file"

          "$RUNNER_TEMP/dvc-ci-venv/bin/dvc" pull

          echo "DVC artifacts downloaded successfully."

      - name: Run tests
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: python -m pytest -v